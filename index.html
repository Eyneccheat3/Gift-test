<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #17212b;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 85%;
      max-width: 400px;
      padding: 30px 20px;
      text-align: center;
      background: #202b36;
      border-radius: 20px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #2aabee;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🎁 Подарок</h1>
    <p>Вам доступен тестовый подарок.</p>
    <button>Получить подарок</button>
  </div>
</body>
</html>
